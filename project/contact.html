<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Creative Works, Talk With Our Team</title>
<meta name="description" content="Tell us about your behavioral health organization and the support you need. Creative Works is based in Phoenix, Arizona and ready to help.">
<meta property="og:title" content="Contact | Creative Works">
<meta property="og:description" content="Tell us about your organization's needs, we'll take it from there.">
<meta property="og:image" content="assets/phoenix-mark.png">
<link rel="canonical" href="https://www.creativeworksaz.com/contact">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="_ds/creative-works-design-system-42e791e1-07c1-40df-bce4-e272f16f1514/styles.css">
<style>
  *{box-sizing:border-box;} html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--color-bg);}
  a{color:inherit;} img{max-width:100%;}
  .cw-mobile-btn{display:none !important;}
  @media (max-width: 900px){ .cw-desktop-nav{display:none !important;} .cw-mobile-btn{display:flex !important;align-items:center;justify-content:center;} }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="image-slot.js"></script>
  <script src="_ds/creative-works-design-system-42e791e1-07c1-40df-bce4-e272f16f1514/_ds_bundle.js"></script>
  <script type="text/babel" src="lib/site.jsx"></script>
  <script type="text/babel" data-presets="react">
    const { Container, Section, PageHero, CONTACT, CONSULT_HREF, mount } = window.CW;
    const { Eyebrow, SectionHeading, Button, Input, Select, Textarea } = window.CreativeWorksDesignSystem_42e791;

    const SERVICE_OPTS = ['Marketing', 'SharePoint Setup', 'IT Services', 'Staffing Support', 'Operational Support', 'Multiple Services', 'Not Sure Yet'];
    const ORG_TYPES = ['Mental Health Clinic', 'Substance Use Treatment', 'Outpatient Program', 'Residential Treatment', 'Recovery Organization', 'Community Behavioral Health', 'Integrated Care', 'Other'];
    const TIMELINES = ['As soon as possible', 'Within 1\u20133 months', '3\u20136 months', 'Just exploring'];
    const BUDGETS = ['Under $5k', '$5k\u2013$15k', '$15k\u2013$50k', '$50k+', 'Not sure yet'];
    const CONTACT_METHODS = ['Email', 'Phone', 'Either'];

    function Checks({ value, onChange }) {
      const toggle = (o) => onChange(value.includes(o) ? value.filter((x) => x !== o) : [...value, o]);
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))', gap: 10 }}>
          {SERVICE_OPTS.map((o) => {
            const on = value.includes(o);
            return (
              <button type="button" key={o} onClick={() => toggle(o)} style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '11px 14px', cursor: 'pointer', textAlign: 'left',
                background: on ? 'color-mix(in srgb, var(--cw-orange) 8%, white)' : '#fff',
                border: '1px solid ' + (on ? 'var(--cw-orange)' : 'var(--border-strong)'), borderRadius: 'var(--radius-md)',
                fontFamily: 'var(--font-body)', fontSize: 'var(--fs-sm)', fontWeight: 600, color: 'var(--text-heading)',
              }}>
                <span style={{ width: 18, height: 18, borderRadius: 5, flex: '0 0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? 'var(--cw-orange)' : '#fff', border: '1px solid ' + (on ? 'var(--cw-orange)' : 'var(--border-strong)') }}>
                  {on && <i data-lucide="check" style={{ width: 13, height: 13, color: '#fff' }}></i>}
                </span>
                {o}
              </button>
            );
          })}
        </div>
      );
    }

    function ContactForm() {
      const [services, setServices] = React.useState([]);
      const [consent, setConsent] = React.useState(false);
      const [sent, setSent] = React.useState(false);
      React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
      const row = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 18 };

      if (sent) {
        return (
          <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow-card)', padding: 'clamp(2rem, 5vw, 3.5rem)', textAlign: 'center' }}>
            <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'color-mix(in srgb, var(--cw-success) 16%, white)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px' }}>
              <i data-lucide="check" style={{ width: 32, height: 32, color: 'var(--cw-success)' }}></i>
            </div>
            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 'var(--fs-h3)', color: 'var(--text-heading)', margin: 0 }}>Thank you, we received your message.</h3>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-body-lg)', color: 'var(--text-muted)', margin: '14px auto 24px', maxWidth: '46ch' }}>A member of the Creative Works team will review your needs and reach out within one business day.</p>
            <Button href="index.html" arrow>Back to Home</Button>
          </div>
        );
      }

      return (
        <form onSubmit={(e) => { e.preventDefault(); setSent(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
          style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow-card)', padding: 'clamp(1.5rem, 4vw, 2.5rem)', display: 'grid', gap: 18 }}>
          <div style={row}><Input label="First name" required /><Input label="Last name" required /></div>
          <div style={row}><Input label="Organization name" required /><Input label="Role / title" /></div>
          <div style={row}><Input label="Email" type="email" required /><Input label="Phone" type="tel" /></div>
          <div style={row}><Input label="Website" type="url" placeholder="https://" /><Select label="Organization type" options={ORG_TYPES} placeholder="Select one" /></div>
          <div>
            <label style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-sm)', fontWeight: 600, color: 'var(--text-heading)', display: 'block', marginBottom: 10 }}>Services you're interested in</label>
            <Checks value={services} onChange={setServices} />
          </div>
          <div style={row}><Select label="Timeline" options={TIMELINES} placeholder="Select one" /><Select label="Budget range (optional)" options={BUDGETS} placeholder="Select one" /></div>
          <Textarea label="How can we help?" rows={5} required placeholder="Tell us a little about your organization and what you're looking for." />
          <Select label="Preferred contact method" options={CONTACT_METHODS} placeholder="Select one" />
          <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', fontFamily: 'var(--font-body)', fontSize: 'var(--fs-sm)', color: 'var(--text-muted)', cursor: 'pointer' }}>
            <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} required style={{ width: 18, height: 18, marginTop: 2, accentColor: 'var(--cw-orange)' }} />
            <span>I agree to be contacted by Creative Works about my inquiry. We respect your privacy and never share your information.</span>
          </label>
          <div><Button type="submit" arrow size="lg" disabled={!consent}>Send Message</Button></div>
        </form>
      );
    }

    function InfoCard() {
      const item = (icon, label, value, href) => (
        <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
          <div style={{ width: 42, height: 42, borderRadius: 'var(--radius-md)', flex: '0 0 auto', background: 'color-mix(in srgb, var(--cw-orange) 9%, white)', border: '1px solid color-mix(in srgb, var(--cw-orange) 22%, white)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--cw-orange)' }}>
            <i data-lucide={icon} style={{ width: 20, height: 20 }}></i>
          </div>
          <div>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 'var(--ls-label)', color: 'var(--text-on-inverse-muted)' }}>{label}</div>
            {href ? <a href={href} style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-body)', color: '#fff', textDecoration: 'none', fontWeight: 600 }}>{value}</a>
                  : <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-body)', color: '#fff', fontWeight: 600 }}>{value}</div>}
          </div>
        </div>
      );
      const STEPS = ['Submit the form with your needs.', 'We review your organization and the fit.', 'We schedule a conversation that works for you.'];
      return (
        <div style={{ display: 'grid', gap: 28 }}>
          <div style={{ background: 'var(--cw-navy-midnight)', color: '#fff', borderRadius: 'var(--radius-xl)', padding: 'clamp(1.5rem, 4vw, 2.25rem)', position: 'relative', overflow: 'hidden' }}>
            <img src="assets/phoenix-mark.png" alt="" aria-hidden="true" style={{ position: 'absolute', right: -40, bottom: -50, width: 200, opacity: 0.08 }} />
            <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--fs-h4)', margin: '0 0 22px', position: 'relative' }}>Reach us directly</h3>
            <div style={{ display: 'grid', gap: 20, position: 'relative' }}>
              {item('map-pin', 'Location', CONTACT.city)}
              {item('mail', 'Email', CONTACT.email, 'mailto:' + CONTACT.email)}
              {item('phone', 'Phone', CONTACT.phone, CONTACT.phoneHref)}
              {item('clock', 'Business Hours', CONTACT.hours[0])}
            </div>
          </div>
          <div style={{ background: 'var(--cw-cloud)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', padding: 'clamp(1.5rem, 4vw, 2.25rem)' }}>
            <Eyebrow>What Happens Next</Eyebrow>
            <div style={{ display: 'grid', gap: 16, marginTop: 18 }}>
              {STEPS.map((s, i) => (
                <div key={i} style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
                  <span style={{ width: 32, height: 32, borderRadius: '50%', flex: '0 0 auto', background: 'var(--cw-gradient-phoenix)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 14 }}>{i + 1}</span>
                  <span style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--fs-body)', color: 'var(--text-body)' }}>{s}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function Page() {
      return (
        <React.Fragment>
          <PageHero
            eyebrow="Contact Us"
            title="Let's talk about your organization."
            lead="Tell us where your team is feeling the strain, staffing, systems, marketing, IT, or operations. We'll review your needs and reach out to find the right next step."
            tone="cloud"
            align="center"
          />
          <Section>
            <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.6fr) minmax(280px, 1fr)', gap: 'clamp(1.5rem, 4vw, 3rem)', alignItems: 'start' }} className="cw-contact-grid">
              <ContactForm />
              <InfoCard />
            </div>
          </Section>
          <Section tone="cloud" pad="clamp(2rem, 4vw, 3rem)">
            <div style={{ textAlign: 'center' }}>
              <SectionHeading align="center" eyebrow="Ready to move faster?" title="Prefer to schedule a consultation directly?" style={{ marginBottom: 24 }} />
              <Button href={CONSULT_HREF} arrow size="lg">Schedule a Consultation</Button>
            </div>
          </Section>
        </React.Fragment>
      );
    }

    mount(<Page />, 'contact');
  </script>
  <style>
    @media (max-width: 860px){ .cw-contact-grid{ grid-template-columns: 1fr !important; } }
  </style>
</body>
</html>
